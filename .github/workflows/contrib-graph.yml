# Publishes the README's generated artwork to the assets branch.
#
# It used to publish four charts as well, on a twice-hourly schedule, and to
# clone every repository to reconstruct the language history behind one of them.
# The README stopped showing them, so the schedule, the clone cache, the
# coverage guard around them and the credentialed steps that produced them went
# with them, and the five generators and their helpers have now gone too: they
# were the only code left that reached the network or needed a token.
#
# The banner and the project cards went the same way when the README became one
# panel. Git has all of it if any of it is wanted back. What is left is static
# and changes when a script changes, which is what the push trigger is for.
name: Profile artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile.mjs"
      - ".github/workflows/contrib-graph.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Generate the profile panel
        run: node scripts/profile.mjs

      - name: Publish to the assets branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: assets
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}