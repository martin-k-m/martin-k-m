name: Profile graphs

on:
  schedule:
    - cron: "7 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/contrib-graph.mjs"
      - "scripts/lang-graph.mjs"
      - ".github/workflows/contrib-graph.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate contribution SVGs
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contrib-graph.mjs
      # Counts every repo the token can see. The Actions GITHUB_TOKEN only sees
      # public ones, so add a PROFILE_TOKEN secret — a PAT with `repo` scope —
      # to include private and org repositories. Without it this still runs and
      # the chart's footer honestly reports the smaller scope it measured.
      - name: Generate language SVG
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/lang-graph.mjs
      - name: Publish to the assets branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: assets
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
