name: Profile graphs

on:
  schedule:
    - cron: "7 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/contrib-graph.mjs"
      - "scripts/lang-graph.mjs"
      - ".github/workflows/contrib-graph.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate contribution SVGs
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contrib-graph.mjs
      # Needs a PROFILE_TOKEN secret — a PAT with `repo` scope. The Actions
      # GITHUB_TOKEN is scoped to this repository alone and cannot enumerate the
      # owner's repositories, so without the secret the script refuses to render
      # rather than publish a chart reading "1 language · 1 repo".
      - name: Generate language SVG
        id: lang
        continue-on-error: true
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/lang-graph.mjs

      # The publish step replaces the whole assets branch, so a skipped language
      # chart would delete the published one and break the README image. Carry
      # the last good copy forward instead; the contribution graphs still update.
      - name: Preserve the last published language chart
        if: steps.lang.outcome != 'success'
        run: |
          echo "::warning::language chart not regenerated — add a PROFILE_TOKEN secret (PAT with repo scope)"
          curl -fsSL -o dist/languages.svg \
            "https://raw.githubusercontent.com/${{ github.repository }}/assets/languages.svg" \
            || echo "::warning::no published language chart to preserve"
      - name: Publish to the assets branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: assets
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
