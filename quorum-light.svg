<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 486" width="820" height="486" role="img" aria-label="quorum: A linearizable replicated key-value store, built on Raft from the protocol up. Consensus as a pure function. Checked, not asserted. The checker earned its keep. Correctness over availability">
<title>quorum: A linearizable replicated key-value store, built on Raft from the protocol up. Consensus as a pure function. Checked, not asserted. The checker earned its keep. Correctness over availability</title>
<defs>
  <clipPath id="pcardquorum-light"><rect x="0" y="0" width="820" height="486" rx="12"/></clipPath>
  <radialGradient id="fadeg-light" cx="50%" cy="50%" r="72%">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset="0.62" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="fade-light" maskUnits="userSpaceOnUse" x="0" y="0" width="820" height="486">
    <rect width="820" height="486" fill="url(#fadeg-light)"/>
  </mask>
  <linearGradient id="ramp-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a99e5e"/>
    <stop offset="1" stop-color="#6d6329"/>
  </linearGradient>
  <radialGradient id="pglow-light" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#a99e5e" stop-opacity="0.18"/>
    <stop offset="0.65" stop-color="#a99e5e" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#a99e5e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="crule-light" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2b2820" stop-opacity="0"/>
    <stop offset="0.18" stop-color="#2b2820" stop-opacity="0.16"/>
    <stop offset="0.82" stop-color="#2b2820" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#2b2820" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .grid { animation: drift 16s linear infinite; }
  @keyframes drift { from { transform: translate(0,0); } to { transform: translate(40px,40px); } }
  .breathe { animation: breathe 8s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.55 } 50% { opacity:1 } }
</style>
<g clip-path="url(#pcardquorum-light)">
  <rect width="820" height="486" fill="#ece7d6"/>
  <g mask="url(#fade-light)"><g class="grid" stroke="#dbd4bf" stroke-opacity="0.9" stroke-width="1"><path d="M-40 -40 V526"/><path d="M0 -40 V526"/><path d="M40 -40 V526"/><path d="M80 -40 V526"/><path d="M120 -40 V526"/><path d="M160 -40 V526"/><path d="M200 -40 V526"/><path d="M240 -40 V526"/><path d="M280 -40 V526"/><path d="M320 -40 V526"/><path d="M360 -40 V526"/><path d="M400 -40 V526"/><path d="M440 -40 V526"/><path d="M480 -40 V526"/><path d="M520 -40 V526"/><path d="M560 -40 V526"/><path d="M600 -40 V526"/><path d="M640 -40 V526"/><path d="M680 -40 V526"/><path d="M720 -40 V526"/><path d="M760 -40 V526"/><path d="M800 -40 V526"/><path d="M840 -40 V526"/><path d="M-40 -40 H860"/><path d="M-40 0 H860"/><path d="M-40 40 H860"/><path d="M-40 80 H860"/><path d="M-40 120 H860"/><path d="M-40 160 H860"/><path d="M-40 200 H860"/><path d="M-40 240 H860"/><path d="M-40 280 H860"/><path d="M-40 320 H860"/><path d="M-40 360 H860"/><path d="M-40 400 H860"/><path d="M-40 440 H860"/><path d="M-40 480 H860"/><path d="M-40 520 H860"/></g></g>
  <ellipse class="breathe" cx="698" cy="243" rx="230" ry="283" fill="url(#pglow-light)"/>
  <g transform="translate(698 232)">
    <path d="M-16 -56 V56" fill="none" stroke="#cec6ac" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="3 4"/>
    <path d="M-66 -34 V34" fill="none" stroke="url(#ramp-light)" stroke-width="1.4" stroke-opacity="0.55"/>
    <circle cx="-66" cy="-34" r="8.5" fill="url(#ramp-light)"/>
    <circle cx="-66" cy="0" r="8.5" fill="url(#ramp-light)"/>
    <circle cx="-66" cy="34" r="8.5" fill="url(#ramp-light)"/>
    <circle cx="34" cy="-17" r="8.5" fill="#ece7d6" stroke="#cec6ac" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="34" cy="17" r="8.5" fill="#ece7d6" stroke="#cec6ac" stroke-opacity="0.7" stroke-width="1.6"/>
    <text x="-66" y="-52" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="url(#ramp-light)" letter-spacing="1.2">MAJORITY</text>
    <text x="34" y="-42" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="#746e59" letter-spacing="1.2">MINORITY</text>
    <text x="-11" y="74" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" fill="url(#ramp-light)" letter-spacing="1.2">3 OF 5 · COMMITTED</text>
    <text x="-11" y="92" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#2b2820">the other 2 refuse</text>
  </g>
  <text x="28" y="44" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="600" fill="#55503f" letter-spacing="1.6" opacity="1">SIDE PROJECT</text>
  <text x="28" y="78" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="url(#ramp-light)" opacity="1">quorum</text>
  <text x="28" y="102" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#2b2820" textLength="561.6" lengthAdjust="spacing" opacity="1">A linearizable replicated key-value store, built on Raft from the protocol up.</text>
  <g opacity="1">
    <rect x="28" y="126" width="6" height="6" rx="1.5" fill="url(#ramp-light)"/>
    <text x="44" y="134" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#2b2820" textLength="201.6" lengthAdjust="spacing">Consensus as a pure function</text>
  </g>
  <text x="44" y="152" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="541.2" lengthAdjust="spacing" opacity="1">Leader election and log replication are a deterministic state machine with no I/O,</text>
  <text x="44" y="167" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="534.6" lengthAdjust="spacing" opacity="1">no clock and no goroutines, driven only by Step and Tick, so a whole cluster runs</text>
  <text x="44" y="182" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="501.6" lengthAdjust="spacing" opacity="1">inside one seeded simulator and a failing run is reproducible from its seed.</text>
  <g opacity="1">
    <rect x="28" y="203" width="6" height="6" rx="1.5" fill="url(#ramp-light)"/>
    <text x="44" y="211" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#2b2820" textLength="151.2" lengthAdjust="spacing">Checked, not asserted</text>
  </g>
  <text x="44" y="229" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="534.6" lengthAdjust="spacing" opacity="1">A Wing-Gong linearizability checker decides whether a recorded history could have</text>
  <text x="44" y="244" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="534.6" lengthAdjust="spacing" opacity="1">come from a single sequential store, run against a live 3-node cluster under real</text>
  <text x="44" y="259" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="475.2" lengthAdjust="spacing" opacity="1">partitions: 25 fault-injected schedules, 3,000 operations, 0 violations.</text>
  <g opacity="1">
    <rect x="28" y="280" width="6" height="6" rx="1.5" fill="url(#ramp-light)"/>
    <text x="44" y="288" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#2b2820" textLength="194.4" lengthAdjust="spacing">The checker earned its keep</text>
  </g>
  <text x="44" y="306" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="521.4" lengthAdjust="spacing" opacity="1">It found three real bugs before that number was honest, including a partitioned</text>
  <text x="44" y="321" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="547.8" lengthAdjust="spacing" opacity="1">leader still answering reads from stale data, and a reused Raft index that reported</text>
  <text x="44" y="336" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="429.0" lengthAdjust="spacing" opacity="1">success to the wrong caller for an entry that had been discarded.</text>
  <g opacity="1">
    <rect x="28" y="357" width="6" height="6" rx="1.5" fill="url(#ramp-light)"/>
    <text x="44" y="365" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#2b2820" textLength="208.8" lengthAdjust="spacing">Correctness over availability</text>
  </g>
  <text x="44" y="383" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="508.2" lengthAdjust="spacing" opacity="1">With a majority reachable it serves reads and writes; with only a minority it</text>
  <text x="44" y="398" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="514.8" lengthAdjust="spacing" opacity="1">refuses them rather than diverge. Reads take the same barrier writes do, so an</text>
  <text x="44" y="413" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#55503f" textLength="356.4" lengthAdjust="spacing" opacity="1">isolated node fails closed instead of answering wrong.</text>
  <rect x="28" y="444" width="764" height="1.2" fill="url(#crule-light)"/>
  <text x="28" y="466" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#55503f" opacity="1">Go · sibling to strata · go test -race ./...</text>
</g>
<rect x="0.5" y="0.5" width="819" height="485" rx="11.5" fill="none" stroke="#cec6ac" stroke-opacity="0.7"/>
</svg>