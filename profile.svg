<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 985" width="880" height="985" role="img" aria-labelledby="title desc" fill="none">
<title id="title">Martin Muskov — Credda, twill, and everything else</title>
<desc id="desc">A terminal panel. whoami gives the name and what the work is; credda and twill each get a paragraph and three claims; then ten other projects, one line each.</desc>
<style>
:root {
  --bg: #0b0f0e;
  --edge: #1f2724;
  --hair: #161d1b;
  --fg: #e3ebe5;
  --mid: #a2b2a9;
  --dim: #6d7c75;
  --accent: #7ec98f;
}
.card { fill: var(--bg); stroke: var(--edge); stroke-width: 1; }
.rule { stroke: var(--edge); stroke-width: 1; }
.hair { stroke: var(--hair); stroke-width: 1; }
.fg { fill: var(--fg); }
.mid { fill: var(--mid); }
.dim { fill: var(--dim); }
.accent { fill: var(--accent); }
.dot { fill: var(--dim); }
.caret { fill: var(--accent); animation: blink 1.1s steps(1) infinite; }
.packet { fill: var(--accent); opacity: 0.5; animation: run 9s linear infinite; }
@keyframes blink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
@keyframes run {
  0%   { transform: translateX(-60px); opacity: 0 }
  6%   { opacity: 0.5 }
  94%  { opacity: 0.5 }
  100% { transform: translateX(940px); opacity: 0 }
}
@media (prefers-reduced-motion: reduce) {
  .caret, .packet { animation: none }
}
</style>
<rect x="0.5" y="0.5" width="879" height="984" rx="10" class="card"/>
<path d="M0 44 H880" class="rule"/>
<circle cx="24" cy="22" r="5.5" class="dot" opacity="0.5"/><circle cx="42" cy="22" r="5.5" class="dot" opacity="0.38"/><circle cx="60" cy="22" r="5.5" class="dot" opacity="0.26"/>
<text x="96" y="27" class="dim" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="144.0" lengthAdjust="spacing" xml:space="preserve">martin-k-m — profile</text>
<rect class="packet" x="0" y="42.5" width="46" height="3" rx="1.5"/>
<text x="28" y="84" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">$</text><text x="44.8" y="84" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" textLength="50.4" lengthAdjust="spacing" xml:space="preserve">whoami</text>
<text x="28" y="110" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" textLength="171.6" lengthAdjust="spacing" xml:space="preserve">Martin Muskov</text>
<text x="28" y="134" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="273.0" lengthAdjust="spacing" xml:space="preserve">SWE &amp; CTO @ Credda  ·  EE/CS @ UCSC</text>
<text x="28" y="153" class="dim" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="436.8" lengthAdjust="spacing" xml:space="preserve">systems software, and trying to break it before it ships</text>
<text x="28" y="199" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">$</text><text x="44.8" y="199" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">credda --what</text><text x="28" y="227" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700" textLength="61.2" lengthAdjust="spacing" xml:space="preserve">Credda</text><text x="28" y="249" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="522.6" lengthAdjust="spacing" xml:space="preserve">Something broke in production. Credda ships the fix: it prepares an</text><text x="28" y="267" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="561.6" lengthAdjust="spacing" xml:space="preserve">environment, reproduces the failure, captures the signature as evidence,</text><text x="28" y="285" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="538.2" lengthAdjust="spacing" xml:space="preserve">diagnoses the cause, writes the patch, and proves it with a test that</text><text x="28" y="303" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="569.4" lengthAdjust="spacing" xml:space="preserve">fails before and passes after. A person reviews a diff, not a bug report.</text><text x="28" y="327" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">✓</text><text x="43.6" y="327" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="280.8" lengthAdjust="spacing" xml:space="preserve">reproduction is the gate, not a step</text><text x="28" y="346" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">✓</text><text x="43.6" y="346" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="358.8" lengthAdjust="spacing" xml:space="preserve">every material claim cites a recorded artifact</text><text x="28" y="365" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">✓</text><text x="43.6" y="365" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="226.2" lengthAdjust="spacing" xml:space="preserve">it proposes, and never merges</text><text x="28" y="388" class="dim" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="453.6" lengthAdjust="spacing" xml:space="preserve">chief technology officer  ·  credda.io  ·  github.com/Credda-io</text><path d="M28 402 H852" class="hair"/>
<text x="28" y="436" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">$</text><text x="44.8" y="436" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" textLength="100.8" lengthAdjust="spacing" xml:space="preserve">twill --what</text><text x="28" y="464" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="17" font-weight="700" textLength="51.0" lengthAdjust="spacing" xml:space="preserve">twill</text><text x="28" y="486" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="530.4" lengthAdjust="spacing" xml:space="preserve">A language where tensors are the primitive and a shape mistake is an</text><text x="28" y="504" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="538.2" lengthAdjust="spacing" xml:space="preserve">error you see before the program runs. Most numeric code is a general</text><text x="28" y="522" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="538.2" lengthAdjust="spacing" xml:space="preserve">language with a framework bolted on; this is the other direction. The</text><text x="28" y="540" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="569.4" lengthAdjust="spacing" xml:space="preserve">compiler is written in twill, and ten libraries downstream of it are too.</text><text x="28" y="564" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">✓</text><text x="43.6" y="564" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="327.6" lengthAdjust="spacing" xml:space="preserve">shape and unit errors caught at check time</text><text x="28" y="583" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">✓</text><text x="43.6" y="583" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="312.0" lengthAdjust="spacing" xml:space="preserve">differentiation is syntax, not a library</text><text x="28" y="602" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="7.8" lengthAdjust="spacing" xml:space="preserve">✓</text><text x="43.6" y="602" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="319.8" lengthAdjust="spacing" xml:space="preserve">one deterministic binary, no dependencies</text><text x="28" y="625" class="dim" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="367.2" lengthAdjust="spacing" xml:space="preserve">v1.9.0  ·  10 repositories  ·  twill-lang.github.io</text><path d="M28 639 H852" class="hair"/>
<text x="28" y="673" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">$</text><text x="44.8" y="673" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" textLength="168.0" lengthAdjust="spacing" xml:space="preserve">ls ~/everything-else</text>
<text x="28" y="701" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="31.2" lengthAdjust="spacing" xml:space="preserve">arc/</text>
<text x="158" y="701" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="28.8" lengthAdjust="spacing" xml:space="preserve">Rust</text>
<text x="228" y="701" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="429.0" lengthAdjust="spacing" xml:space="preserve">an execution cache that traces what a build really read</text>
<text x="28" y="722" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">quorum/</text>
<text x="158" y="722" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">Go</text>
<text x="228" y="722" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="397.8" lengthAdjust="spacing" xml:space="preserve">a Raft key-value store, checked for linearizability</text>
<text x="28" y="743" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">strata/</text>
<text x="158" y="743" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="28.8" lengthAdjust="spacing" xml:space="preserve">Java</text>
<text x="228" y="743" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="397.8" lengthAdjust="spacing" xml:space="preserve">an LSM storage engine, recovery proved byte by byte</text>
<text x="28" y="764" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">scalar/</text>
<text x="158" y="764" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">TS</text>
<text x="228" y="764" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="436.8" lengthAdjust="spacing" xml:space="preserve">self-hosted productivity infrastructure, 11 repositories</text>
<text x="28" y="785" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">quarry/</text>
<text x="158" y="785" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="43.2" lengthAdjust="spacing" xml:space="preserve">Python</text>
<text x="228" y="785" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="343.2" lengthAdjust="spacing" xml:space="preserve">a SQL engine over CSV, standard library only</text>
<text x="28" y="806" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="70.2" lengthAdjust="spacing" xml:space="preserve">lincheck/</text>
<text x="158" y="806" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">Go</text>
<text x="228" y="806" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="374.4" lengthAdjust="spacing" xml:space="preserve">quorum's linearizability checker, made pointable</text>
<text x="28" y="827" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="62.4" lengthAdjust="spacing" xml:space="preserve">capsule/</text>
<text x="158" y="827" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">Go</text>
<text x="228" y="827" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="366.6" lengthAdjust="spacing" xml:space="preserve">throwaway dev environments from one config file</text>
<text x="28" y="848" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="46.8" lengthAdjust="spacing" xml:space="preserve">drift/</text>
<text x="158" y="848" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="28.8" lengthAdjust="spacing" xml:space="preserve">Rust</text>
<text x="228" y="848" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="327.6" lengthAdjust="spacing" xml:space="preserve">diff two tables by key rather than by line</text>
<text x="28" y="869" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="54.6" lengthAdjust="spacing" xml:space="preserve">tandem/</text>
<text x="158" y="869" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="28.8" lengthAdjust="spacing" xml:space="preserve">Java</text>
<text x="228" y="869" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="327.6" lengthAdjust="spacing" xml:space="preserve">durable workflow orchestration for the JVM</text>
<text x="28" y="890" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="109.2" lengthAdjust="spacing" xml:space="preserve">poliarchitect/</text>
<text x="158" y="890" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">TS</text>
<text x="228" y="890" class="mid" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="400" textLength="382.2" lengthAdjust="spacing" xml:space="preserve">a political economy sandbox, ticked on a schedule</text>
<text x="28" y="919" class="dim" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" textLength="374.4" lengthAdjust="spacing" xml:space="preserve">the rest, always current, is on the repositories tab</text>
<text x="28" y="959" class="accent" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="700" textLength="8.4" lengthAdjust="spacing" xml:space="preserve">$</text><text x="44.8" y="959" class="fg" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" font-weight="500" textLength="0.0" lengthAdjust="spacing" xml:space="preserve"></text>
<rect class="caret" x="45" y="948" width="8" height="14" rx="1"/>
</svg>
